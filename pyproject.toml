[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nurin"
description = 'Taasko se netti on nurin'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = []
authors = [
    { name = "Aarni Koskela", email = "akx@iki.fi" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "click",
]
dynamic = ["version"]

[project.scripts]
nurin = "nurin.__main__:main"

[project.urls]
Documentation = "https://github.com/akx/nurin#readme"
Issues = "https://github.com/akx/nurin/issues"
Source = "https://github.com/akx/nurin"

[tool.hatch.version]
path = "nurin/__about__.py"

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-cov>=4.1.0",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
    "nurin/__about__.py",
]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "ANN",
    "B",
    "C",
    "E",
    "F",
    "W",
]
ignore = [
    "E501",
    "ANN101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
